[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-status-api"
version = "0.1.0"
description = "Public read-only JSON status API for Endstone Minecraft Bedrock servers"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11",
    "psutil>=5",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ReallocAll/endstone-status-api"
Repository = "https://github.com/ReallocAll/endstone-status-api"
Issues = "https://github.com/ReallocAll/endstone-status-api/issues"

[project.entry-points."endstone"]
status_api = "endstone_status_api:StatusAPI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endstone_status_api = ["openapi.json"]
